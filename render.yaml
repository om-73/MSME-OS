services:
  - type: web
    name: msme-erp-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8081
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: msme-erp-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: msme-erp-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: msme-erp-db
          property: password
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: msme-erp-db
    plan: free
    region: oregon
    databaseName: msme_erp
    user: erp_user
